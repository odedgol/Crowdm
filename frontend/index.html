<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Crowdm — Native Ads Audience Simulator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.1/dist/cdn.min.js"></script>
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body x-data="app()" x-init="init()">

  <!-- ======== TOP BAR ======== -->
  <header class="topbar">
    <div class="max-w-6xl mx-auto px-6 py-3 flex items-center gap-4">
      <div class="flex items-center gap-3">
        <span class="brand-mark">C</span>
        <div>
          <div class="font-semibold text-base leading-tight">Crowdm</div>
          <div class="text-xs text-slate-500 leading-tight">Native-ads audience simulator</div>
        </div>
      </div>

      <nav class="tabs ml-6">
        <div class="tab" :class="view === 'setup' && 'active'" @click="view='setup'">Setup</div>
        <div class="tab" :class="view === 'report' && 'active'" :disabled="!result" @click="result && (view='report')">
          Report
          <span x-show="result" class="ml-1 inline-block w-1.5 h-1.5 rounded-full bg-indigo-500"></span>
        </div>
      </nav>

      <div class="ml-auto flex items-center gap-2" x-show="health">
        <a href="/mocks" class="pill" style="text-decoration: none;">UI mocks ↗</a>
        <span class="pill">model · <span x-text="health?.model"></span></span>
        <span class="pill" :class="health?.has_api_key ? 'pill-ok' : 'pill-bad'">
          <span class="dot"></span>
          <span x-text="health?.has_api_key ? 'API key set' : 'No API key'"></span>
        </span>
      </div>
    </div>
  </header>

  <main class="max-w-6xl mx-auto px-6 py-8">

    <!-- ============================ SETUP VIEW ============================ -->
    <template x-if="view === 'setup'">
      <section>
        <div class="mb-6">
          <h1 class="text-2xl font-semibold tracking-tight">New simulation</h1>
          <p class="text-slate-500 text-sm mt-1">Walk a synthetic audience through your funnel and see where they bounce, why, and what to fix.</p>
        </div>

        <!-- 1. Product -->
        <div class="card">
          <div class="flex items-center gap-3 mb-5">
            <span class="step-badge">1</span>
            <div>
              <h2>Product &amp; audience</h2>
              <p class="helper">What you're selling and who it's meant for.</p>
            </div>
          </div>
          <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div>
              <label class="label">Product name</label>
              <input class="input" type="text" x-model="campaignA.product.name" placeholder="AuroraGlow Sunrise Alarm" />
            </div>
            <div>
              <label class="label">Price (as shown to user)</label>
              <input class="input" type="text" x-model="campaignA.product.price" placeholder="$79 (was $119) · free shipping" />
            </div>
            <div class="md:col-span-2">
              <label class="label">Target audience</label>
              <input class="input" type="text" x-model="campaignA.product.target_audience" placeholder="Urban 25-45, poor sleep, already use wellness apps" />
            </div>
            <div class="md:col-span-2">
              <label class="label">Product description</label>
              <textarea class="input h-24" x-model="campaignA.product.description" placeholder="What it is, what it does, why anyone should care."></textarea>
            </div>
          </div>
        </div>

        <!-- 2. Ad creative -->
        <div class="card">
          <div class="flex items-center gap-3 mb-5">
            <span class="step-badge">2</span>
            <div>
              <h2>Ad creative</h2>
              <p class="helper">The native-ad slot the user sees on the publisher site.</p>
            </div>
          </div>
          <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div>
              <label class="label">Headline</label>
              <input class="input" type="text" x-model="campaignA.ad.headline" />
            </div>
            <div>
              <label class="label">CTA button</label>
              <input class="input" type="text" x-model="campaignA.ad.cta" placeholder="See how it works" />
            </div>
            <div class="md:col-span-2">
              <label class="label">Body / subheadline</label>
              <textarea class="input h-20" x-model="campaignA.ad.body"></textarea>
            </div>
            <div class="md:col-span-2">
              <label class="label">Ad image (optional)</label>
              <input class="input" type="file" accept="image/*" @change="onAdImage($event, campaignA)" />
              <template x-if="campaignA.ad.image_base64">
                <img :src="'data:' + campaignA.ad.image_media_type + ';base64,' + campaignA.ad.image_base64" class="mt-3 max-h-40 rounded-lg border border-slate-200" />
              </template>
            </div>
          </div>
        </div>

        <!-- 3. Stages -->
        <div class="card">
          <div class="flex items-center gap-3 mb-5">
            <span class="step-badge">3</span>
            <div>
              <h2>Funnel stages</h2>
              <p class="helper">For each stage: a URL we'll fetch, pasted text/HTML, or a screenshot. Skip stages you don't have.</p>
            </div>
          </div>
          <template x-for="(stage, i) in campaignA.stages" :key="stage.kind">
            <div class="stage-row" :class="!stage.enabled && 'is-disabled'" x-show="stage.kind !== 'ad'">
              <div class="flex items-center justify-between mb-2">
                <div class="font-medium text-sm" x-text="stageLabel(stage.kind)"></div>
                <label class="text-xs text-slate-500 flex items-center gap-2 cursor-pointer">
                  <input type="checkbox" x-model="stage.enabled" /> include
                </label>
              </div>
              <div x-show="stage.enabled" class="grid grid-cols-1 md:grid-cols-2 gap-3 mt-2">
                <div>
                  <label class="label">URL</label>
                  <input class="input" type="text" x-model="stage.url" placeholder="https://..." />
                </div>
                <div>
                  <label class="label">Screenshot (optional)</label>
                  <input class="input" type="file" accept="image/*" @change="onStageImage($event, stage)" />
                </div>
                <div class="md:col-span-2">
                  <label class="label">Pasted text or HTML</label>
                  <textarea class="input h-20" x-model="stage.text" placeholder="Paste the visible page text if no URL"></textarea>
                </div>
                <div class="md:col-span-2">
                  <label class="label">Advertiser notes (optional)</label>
                  <input class="input" type="text" x-model="stage.notes" placeholder="e.g. 30s autoplay video at the top" />
                </div>
                <template x-if="stage.screenshot_base64">
                  <img :src="'data:' + stage.screenshot_media_type + ';base64,' + stage.screenshot_base64" class="md:col-span-2 max-h-48 rounded-lg border border-slate-200" />
                </template>
              </div>
            </div>
          </template>
        </div>

        <!-- 4. Personas -->
        <div class="card">
          <div class="flex items-start gap-3 mb-5">
            <span class="step-badge">4</span>
            <div class="flex-1">
              <div class="flex items-center justify-between flex-wrap gap-3">
                <div>
                  <h2>Personas</h2>
                  <p class="helper">Edit the built-ins to match your audience or add custom ones.</p>
                </div>
                <div class="flex items-center gap-2">
                  <span class="pill" x-text="selectedCount() + ' selected'"></span>
                  <button class="btn btn-secondary btn-sm" @click="addCustomPersona()">+ Add custom</button>
                  <button class="btn btn-ghost btn-sm" @click="resetPersonas()">Reset</button>
                </div>
              </div>
            </div>
          </div>
          <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
            <template x-for="(p, i) in personas" :key="p.id">
              <div class="persona-card" :class="p.selected && 'is-selected'">
                <div class="flex items-start gap-3">
                  <input type="checkbox" x-model="p.selected" class="mt-1 accent-indigo-600 w-4 h-4" />
                  <div class="flex-1 min-w-0">
                    <template x-if="!p.editing">
                      <div>
                        <div class="name" x-text="p.name"></div>
                        <div class="arch" x-text="p.archetype"></div>
                        <div class="sheet" x-text="p.character_sheet.length > 180 ? p.character_sheet.slice(0, 180) + '…' : p.character_sheet"></div>
                      </div>
                    </template>
                    <template x-if="p.editing">
                      <div class="space-y-2">
                        <div>
                          <label class="label">Name</label>
                          <input class="input" type="text" x-model="p.name" />
                        </div>
                        <div>
                          <label class="label">Archetype</label>
                          <input class="input" type="text" x-model="p.archetype" />
                        </div>
                        <div>
                          <label class="label">Character sheet</label>
                          <textarea class="input h-32" x-model="p.character_sheet" placeholder="Demographics, budget, skepticism, trust triggers, common objections."></textarea>
                        </div>
                      </div>
                    </template>
                  </div>
                  <div class="flex flex-col gap-1 shrink-0">
                    <template x-if="!p.editing">
                      <button class="btn btn-ghost btn-sm" @click="p.editing = true">Edit</button>
                    </template>
                    <template x-if="p.editing">
                      <button class="btn btn-ghost btn-sm" style="color: var(--success);" @click="p.editing = false">Done</button>
                    </template>
                    <template x-if="p.id.startsWith('custom_')">
                      <button class="btn btn-ghost btn-sm" style="color: var(--danger);" @click="deletePersona(i)">Delete</button>
                    </template>
                  </div>
                </div>
              </div>
            </template>
          </div>
        </div>

        <!-- 5. A/B variant -->
        <div class="card">
          <label class="flex items-center gap-3 cursor-pointer">
            <input type="checkbox" x-model="abEnabled" class="accent-indigo-600 w-4 h-4" />
            <div>
              <div class="font-semibold">A/B compare with a second variant</div>
              <div class="text-xs text-slate-500">Same product &amp; funnel, change the parts you want to test.</div>
            </div>
          </label>
          <template x-if="abEnabled">
            <div class="mt-4 subtle space-y-3">
              <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                <div>
                  <label class="label">Variant B headline</label>
                  <input class="input" type="text" x-model="campaignB.ad.headline" />
                </div>
                <div>
                  <label class="label">Variant B CTA</label>
                  <input class="input" type="text" x-model="campaignB.ad.cta" />
                </div>
                <div class="md:col-span-2">
                  <label class="label">Variant B body</label>
                  <textarea class="input h-20" x-model="campaignB.ad.body"></textarea>
                </div>
                <div class="md:col-span-2">
                  <label class="label">Variant B price (if different)</label>
                  <input class="input" type="text" x-model="campaignB.product.price" />
                </div>
                <div class="md:col-span-2">
                  <label class="label">Variant B ad image (optional)</label>
                  <input class="input" type="file" accept="image/*" @change="onAdImage($event, campaignB)" />
                </div>
              </div>
            </div>
          </template>
        </div>

        <!-- Action bar -->
        <div class="action-bar">
          <div class="max-w-6xl mx-auto px-0 flex flex-wrap items-center gap-3">
            <button class="btn btn-primary" :disabled="running || !canRun()" @click="run()">
              <template x-if="!running"><span>Run simulation →</span></template>
              <template x-if="running">
                <span class="flex items-center gap-2"><span class="spinner"></span><span>Running…</span></span>
              </template>
            </button>
            <button class="btn btn-secondary" @click="loadDemo()">Load demo campaign</button>
            <template x-if="result">
              <button class="btn btn-secondary" @click="view='report'">View last results →</button>
            </template>
            <span x-show="errorMsg" class="text-sm text-red-600 ml-auto" x-text="errorMsg"></span>
            <span x-show="running" class="text-xs text-slate-500 ml-auto" x-text="progressNote"></span>
          </div>
        </div>
      </section>
    </template>

    <!-- ============================ REPORT VIEW ============================ -->
    <template x-if="view === 'report'">
      <section>
        <div class="flex items-center justify-between mb-6">
          <div>
            <h1 class="text-2xl font-semibold tracking-tight">Simulation report</h1>
            <p class="text-sm text-slate-500 mt-1" x-show="result?.token_usage">
              Tokens: <span x-text="formatTokens(result?.token_usage)"></span>
            </p>
          </div>
          <button class="btn btn-secondary" @click="view='setup'">← Back to setup</button>
        </div>

        <!-- A/B verdict -->
        <template x-if="result?.ab_verdict">
          <div class="card" style="background: linear-gradient(135deg, #fef3c7, #fff); border-color: #fde68a;">
            <div class="flex items-center gap-2 mb-2">
              <span class="pill" style="background: #fef3c7; color: #92400e; border-color: #fcd34d;">A/B verdict</span>
              <span class="font-semibold">Overall winner: <span x-text="result.ab_verdict.overall_winner"></span></span>
            </div>
            <p class="text-sm text-slate-700" x-text="result.ab_verdict.overall_reasoning"></p>
            <details class="mt-3 text-sm">
              <summary class="cursor-pointer text-slate-600 select-none">Per-persona breakdown</summary>
              <ul class="mt-2 space-y-1">
                <template x-for="pp in result.ab_verdict.per_persona" :key="pp.persona_id">
                  <li><strong x-text="pp.persona_name"></strong> → <span x-text="pp.winner"></span>: <span class="text-slate-600" x-text="pp.reason"></span></li>
                </template>
              </ul>
            </details>
          </div>
        </template>

        <template x-for="(report, idx) in result?.reports || []" :key="report.campaign_label + idx">
          <div class="mt-6">
            <h2 class="text-xl font-semibold mb-4" x-text="'Campaign ' + report.campaign_label"></h2>

            <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-5">
              <div class="metric">
                <div class="label">Personas simulated</div>
                <div class="value" x-text="report.personas.length"></div>
              </div>
              <div class="metric">
                <div class="label">Reached checkout</div>
                <div class="value" x-text="Math.round(report.conversion_rate * 100) + '%'"></div>
              </div>
              <div class="metric">
                <div class="label">Issues found</div>
                <div class="value" x-text="report.top_issues.length"></div>
              </div>
            </div>

            <div class="card">
              <h3 class="font-semibold mb-3 text-sm uppercase tracking-wide text-slate-500">Funnel drop-off</h3>
              <canvas :id="'funnel-' + idx" height="100"></canvas>
            </div>

            <div class="card">
              <h3 class="font-semibold mb-3 text-sm uppercase tracking-wide text-slate-500">Top issues</h3>
              <ol class="space-y-3">
                <template x-for="issue in report.top_issues" :key="issue.title">
                  <li class="issue-card">
                    <div class="title" x-text="issue.title + ' · x' + issue.frequency"></div>
                    <div class="meta" x-text="issue.stage ? 'Stage: ' + stageLabel(issue.stage) : 'Cross-stage'"></div>
                    <div class="recom" x-text="'→ ' + issue.recommendation"></div>
                    <ul>
                      <template x-for="q in issue.example_quotes"><li x-text="'“' + q + '”'"></li></template>
                    </ul>
                  </li>
                </template>
              </ol>
            </div>

            <div class="card">
              <h3 class="font-semibold mb-3 text-sm uppercase tracking-wide text-slate-500">Per-persona journeys</h3>
              <template x-for="p in report.personas" :key="p.persona_id">
                <details class="persona-journey mb-2">
                  <summary class="cursor-pointer flex items-center justify-between gap-2 select-none">
                    <span>
                      <span class="font-semibold" x-text="p.persona_name"></span>
                      <span class="text-slate-500 text-sm ml-1" x-text="'· ' + p.archetype"></span>
                    </span>
                    <span class="pill" :class="p.converted ? 'pill-ok' : 'pill-bad'"
                          x-text="p.converted ? '✓ converted' : ('✗ dropped at ' + stageLabel(p.dropped_at))"></span>
                  </summary>
                  <div class="mt-3 text-sm italic text-slate-700" x-text="'“' + p.final_summary + '”'"></div>
                  <div class="mt-3">
                    <template x-for="s in p.stages" :key="s.stage">
                      <div class="stage-reaction" :class="!s.continues && 'dropped'">
                        <div class="text-xs font-medium uppercase tracking-wide text-slate-500" x-text="stageLabel(s.stage)"></div>
                        <div class="text-sm mt-1" x-text="s.reaction"></div>
                        <div class="text-xs text-slate-500 mt-1" x-text="scoresLine(s.scores)"></div>
                        <template x-if="s.drop_reason">
                          <div class="text-xs text-red-600 mt-1">Drop reason: <span x-text="s.drop_reason"></span></div>
                        </template>
                      </div>
                    </template>
                  </div>
                </details>
              </template>
            </div>
          </div>
        </template>
      </section>
    </template>

  </main>

  <script src="/static/app.js"></script>
</body>
</html>
