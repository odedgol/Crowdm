<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Crowdm — Native Ads Audience Simulator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.1/dist/cdn.min.js"></script>
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body x-data="app()" x-init="init()" x-cloak>

  <!-- ==================== TOP BAR ==================== -->
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <span class="brand-logo">👥</span>
        <span class="brand-name">Crowdm</span>
        <template x-if="view === 'setup'">
          <span class="brand-sub"><span class="brand-sep">—</span> Native Ads Audience Simulator</span>
        </template>
        <template x-if="view === 'report'">
          <span class="brand-sub"><span class="brand-sep">/</span> <span class="brand-sub-light">Report</span></span>
        </template>
      </div>

      <div class="top-actions">
        <template x-if="view === 'setup'">
          <div style="display: flex; align-items: center; gap: 10px;">
            <a class="top-link" href="#config">Configuration</a>
            <button class="btn btn-secondary" @click="loadDemo()">Load Demo Campaign</button>
            <button class="btn btn-primary" :disabled="running || !canRun()" @click="run()">
              <template x-if="!running"><span>Run Simulation →</span></template>
              <template x-if="running"><span><span class="spinner"></span> Running…</span></template>
            </button>
            <template x-if="result">
              <button class="btn btn-secondary" @click="view='report'">View Results</button>
            </template>
          </div>
        </template>
        <template x-if="view === 'report'">
          <div style="display: flex; align-items: center; gap: 12px;">
            <div class="top-meta">
              <div class="title" x-text="campaignA.product.name || 'Campaign report'"></div>
              <div class="sub">
                <span x-text="reportTimestamp()"></span>
                <template x-if="lastRunModel"> — <span x-text="lastRunModel"></span> model</template>
              </div>
            </div>
            <button class="btn btn-secondary" @click="view='setup'">← Back to Setup</button>
            <button class="btn btn-primary" @click="exportReport()">⎋ Export Report</button>
          </div>
        </template>
      </div>
    </div>
  </header>

  <!-- ==================== SETUP VIEW ==================== -->
  <template x-if="view === 'setup'">
    <main class="main-wrap">
      <div x-show="errorMsg" class="error-banner" x-text="errorMsg"></div>

      <div class="layout-grid">

        <!-- ========== LEFT COLUMN ========== -->
        <div class="col-left">

          <!-- Section 1: Product & Audience -->
          <section class="card">
            <div class="card-head">
              <span class="step-num">1</span>
              <h2>Product &amp; Audience</h2>
            </div>
            <div class="form-grid">
              <div>
                <label class="label">Product Name</label>
                <input class="input" x-model="campaignA.product.name" placeholder="e.g., AuroraGlow Sunrise Alarm" />
              </div>
              <div>
                <label class="label">Price (as shown to user)</label>
                <input class="input" x-model="campaignA.product.price" placeholder="e.g., $49.99" />
              </div>
              <div class="full">
                <label class="label">Target Audience</label>
                <input class="input" x-model="campaignA.product.target_audience" placeholder="e.g., People aged 25-45 who struggle to wake up in winter." />
              </div>
              <div class="full">
                <label class="label">Product Description (for context)</label>
                <textarea class="input" x-model="campaignA.product.description" placeholder="Detailed product specifications, key benefits, and problem it solves..."></textarea>
              </div>
            </div>
          </section>

          <!-- Section 2: Ad Creative -->
          <section class="card">
            <div class="card-head">
              <span class="step-num">2</span>
              <h2>Ad Creative</h2>
              <div class="card-head-spacer"></div>
              <div class="switch-row">
                <span>A/B Test Ad?</span>
                <div class="switch" :class="abEnabled && 'on'" @click="abEnabled = !abEnabled"></div>
              </div>
            </div>
            <div class="form-grid">
              <div>
                <label class="label">Headline</label>
                <input class="input" x-model="campaignA.ad.headline" placeholder="Waking up tired is a choice." />
              </div>
              <div>
                <label class="label">CTA Text</label>
                <input class="input" x-model="campaignA.ad.cta" placeholder="Shop Now - 50% Off" />
              </div>
              <div class="full">
                <label class="label">Body Text</label>
                <textarea class="input" x-model="campaignA.ad.body" placeholder="Clinical trials show sunrise simulation improves mood..."></textarea>
              </div>
              <div class="full">
                <label class="label">Optional Image Description (or upload)</label>
                <div class="stage-input-row">
                  <input class="input" x-model="campaignA.ad.image_description" placeholder="Describe the image (e.g., happy person waking up to warm light)" />
                  <button class="btn btn-secondary" @click="$refs.adImage.click()">Upload Screenshot</button>
                  <input type="file" accept="image/*" x-ref="adImage" style="display:none" @change="onAdImage($event, campaignA)" />
                </div>
                <template x-if="campaignA.ad.image_base64">
                  <img :src="'data:' + campaignA.ad.image_media_type + ';base64,' + campaignA.ad.image_base64" class="mt-2" style="max-height: 140px; margin-top: 8px; border-radius: 8px; border: 1px solid var(--border);" />
                </template>
              </div>
            </div>

            <template x-if="abEnabled">
              <div style="margin-top: 18px; padding-top: 18px; border-top: 1px solid var(--border);">
                <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 12px;">
                  <span class="stage-badge">A/B VARIANT B</span>
                  <span style="font-size: 12.5px; color: var(--text-mute);">Leave blanks to inherit from variant A.</span>
                </div>
                <div class="form-grid">
                  <div>
                    <label class="label">Headline (B)</label>
                    <input class="input" x-model="campaignB.ad.headline" />
                  </div>
                  <div>
                    <label class="label">CTA Text (B)</label>
                    <input class="input" x-model="campaignB.ad.cta" />
                  </div>
                  <div class="full">
                    <label class="label">Body Text (B)</label>
                    <textarea class="input" x-model="campaignB.ad.body"></textarea>
                  </div>
                </div>
              </div>
            </template>
          </section>

          <!-- Section 3: Funnel Stages -->
          <section class="card">
            <div class="card-head">
              <span class="step-num">3</span>
              <h2>Funnel Stages</h2>
            </div>
            <div class="timeline">
              <template x-for="(stage, i) in campaignA.stages" :key="stage.uid">
                <div class="stage" :class="!stage.enabled && 'disabled'">
                  <span class="stage-num" x-text="i + 1"></span>

                  <div class="stage-head">
                    <input class="stage-title" x-model="stage.label" :placeholder="stageDefaultLabel(stage.kind)" />
                    <template x-if="stage.abVariant">
                      <span class="stage-badge">A/B</span>
                    </template>

                    <template x-if="!stage.enabled">
                      <button class="stage-enable" @click="stage.enabled = true">Enable</button>
                    </template>
                    <template x-if="stage.enabled">
                      <button class="stage-close" @click="removeStage(i)" title="Remove stage">✕</button>
                    </template>
                  </div>

                  <template x-if="!stage.enabled">
                    <div class="stage-disabled-hint">Disabled — Skip to next enabled stage</div>
                  </template>

                  <template x-if="stage.enabled">
                    <div class="stage-body">
                      <div class="stage-tabs">
                        <div class="tab-row">
                          <div class="tab-pill" :class="stage.inputMode === 'url' && 'active'" @click="stage.inputMode = 'url'">Fetch URL</div>
                          <div class="tab-pill" :class="stage.inputMode === 'text' && 'active'" @click="stage.inputMode = 'text'">Paste Text/HTML</div>
                          <div class="tab-pill" :class="stage.inputMode === 'screenshot' && 'active'" @click="stage.inputMode = 'screenshot'">Screenshot</div>
                        </div>
                      </div>

                      <template x-if="stage.inputMode === 'url'">
                        <div>
                          <div class="stage-input-row">
                            <input class="input" x-model="stage.url" placeholder="https://myshopify.com/products/auroraglow" />
                            <button class="btn btn-secondary btn-sm" @click="previewStage(stage)" :disabled="stage.previewing || !stage.url">
                              <template x-if="!stage.previewing"><span>Preview</span></template>
                              <template x-if="stage.previewing"><span>…</span></template>
                            </button>
                          </div>
                          <template x-if="stage.preview_ok">
                            <div class="extract-banner">✓ Text extracted successfully (<span x-text="stage.preview_words"></span> words)</div>
                          </template>
                          <template x-if="stage.preview_error">
                            <div class="error-banner" style="margin-top: 8px; margin-bottom: 0;" x-text="stage.preview_error"></div>
                          </template>
                        </div>
                      </template>

                      <template x-if="stage.inputMode === 'text'">
                        <textarea class="input" x-model="stage.text" placeholder="Paste the visible page text or raw HTML here..."></textarea>
                      </template>

                      <template x-if="stage.inputMode === 'screenshot'">
                        <div>
                          <label class="drop-zone">
                            <template x-if="!stage.screenshot_base64">
                              <div>Drag screenshot here or <strong>browse</strong></div>
                            </template>
                            <template x-if="stage.screenshot_base64">
                              <img :src="'data:' + stage.screenshot_media_type + ';base64,' + stage.screenshot_base64" />
                            </template>
                            <input type="file" accept="image/*" style="display:none" @change="onStageImage($event, stage)" />
                          </label>
                        </div>
                      </template>
                    </div>
                  </template>
                </div>
              </template>

              <button class="add-stage-btn" @click="addStage()">+ Add Funnel Stage</button>
            </div>
          </section>

        </div>

        <!-- ========== RIGHT COLUMN ========== -->
        <div class="col-right">

          <section class="card" id="config">
            <div class="card-head">
              <h2><span class="icon">⚙️</span> Simulation Config</h2>
            </div>
            <div style="display: flex; flex-direction: column; gap: 14px;">
              <div>
                <label class="label">Claude Model <span class="mono">(<code>CROWDM_MODEL</code>)</span></label>
                <select class="input" x-model="selectedModel" @change="onModelChange()">
                  <optgroup label="Anthropic (cloud)">
                    <option value="claude-opus-4-7">claude-opus-4-7 (High Accuracy / Cost)</option>
                    <option value="claude-sonnet-4-6">claude-sonnet-4-6 (Balanced)</option>
                    <option value="claude-haiku-4-5-20251001">claude-haiku-4-5 (Fast / Low Cost)</option>
                  </optgroup>
                  <optgroup label="Ollama (local)">
                    <option value="ollama:llama3.3">ollama:llama3.3</option>
                    <option value="ollama:llama3.2-vision">ollama:llama3.2-vision</option>
                    <option value="ollama:gemma2:27b">ollama:gemma2:27b</option>
                    <option value="ollama:qwen2.5:32b">ollama:qwen2.5:32b</option>
                    <option value="ollama:mistral-small">ollama:mistral-small</option>
                    <option value="__ollama_custom__">Ollama: custom model…</option>
                  </optgroup>
                </select>
                <template x-if="selectedModel === '__ollama_custom__'">
                  <div style="margin-top: 8px;">
                    <input class="input" x-model="customOllamaModel" placeholder="e.g., gemma2:9b or deepseek-r1:8b" />
                    <div class="hint">Prefix is added automatically. Model must be pulled locally (<code>ollama pull &lt;name&gt;</code>).</div>
                  </div>
                </template>
                <template x-if="selectedModel.startsWith('ollama:')">
                  <div class="info-hint">Using Ollama: prompt caching and image-in-prompt are skipped; Ollama server must be running locally.</div>
                </template>
              </div>

              <div>
                <label class="label">Concurrency <span class="mono">(<code>CROWDM_CONCURRENCY</code>)</span></label>
                <input class="input" type="number" min="1" max="16" x-model.number="concurrency" />
                <div class="hint">Expected calls: <strong x-text="estimatedCalls()"></strong> based on <span x-text="selectedCount()"></span> personas. Prompt caching applies.</div>
              </div>
            </div>
          </section>

          <section class="card">
            <div class="card-head">
              <span class="step-num">4</span>
              <h2>Select Personas to Test</h2>
            </div>

            <div>
              <template x-for="(p, i) in personas" :key="p.id">
                <div class="persona-item" :class="p.selected && 'selected'">
                  <span class="persona-icon" :class="personaIconClass(i)" x-text="p.icon || '👤'"></span>
                  <div style="min-width: 0;">
                    <template x-if="!p.editing">
                      <div>
                        <div class="name" x-text="p.archetype || p.name"></div>
                        <div class="desc" x-text="shortDesc(p.character_sheet)"></div>
                      </div>
                    </template>
                    <template x-if="p.editing">
                      <div class="persona-edit-row">
                        <input class="input" placeholder="Archetype" x-model="p.archetype" />
                        <input class="input" placeholder="Name" x-model="p.name" />
                        <textarea class="input" placeholder="Character sheet…" x-model="p.character_sheet" style="min-height: 90px;"></textarea>
                        <div style="display: flex; gap: 6px; justify-content: flex-end;">
                          <template x-if="p.id.startsWith('custom_')">
                            <button class="btn btn-danger btn-xs" @click="deletePersona(i)">Delete</button>
                          </template>
                          <button class="btn btn-secondary btn-xs" @click="p.editing = false">Done</button>
                        </div>
                      </div>
                    </template>
                  </div>
                  <div style="display: flex; flex-direction: column; align-items: flex-end; gap: 6px;">
                    <div class="persona-check" :class="p.selected && 'on'" @click="p.selected = !p.selected"></div>
                    <template x-if="!p.editing">
                      <button class="btn btn-ghost btn-xs" style="padding: 2px 6px;" @click="p.editing = true">edit</button>
                    </template>
                  </div>
                </div>
              </template>
            </div>

            <div style="display: flex; gap: 6px; margin-top: 10px;">
              <button class="btn btn-secondary btn-xs" @click="addCustomPersona()">+ Add custom</button>
              <button class="btn btn-ghost btn-xs" @click="resetPersonas()">Reset</button>
            </div>
            <div class="persona-footer">
              <span x-text="selectedCount()"></span> of <span x-text="personas.length"></span> personas selected.
            </div>
          </section>

        </div>
      </div>
    </main>
  </template>

  <!-- ==================== REPORT VIEW ==================== -->
  <template x-if="view === 'report'">
    <main class="report-wrap">
      <template x-if="!result">
        <div class="card">No simulation has been run yet.</div>
      </template>

      <template x-if="result">
        <div>
          <!-- Metric cards row -->
          <div class="metrics-row">
            <div class="metric">
              <div class="mlabel"><span class="mico">👥</span> Personas Simulated</div>
              <div class="mvalue" x-text="activeReport().personas.length"></div>
            </div>
            <div class="metric">
              <div class="mlabel"><span class="mico">🏁</span> Overall Completion Rate</div>
              <div class="mvalue blue">
                <span x-text="Math.round(activeReport().conversion_rate * 100) + '%'"></span>
                <span class="unit" x-text="'(' + convertedOver() + ')'"></span>
              </div>
            </div>
            <div class="metric">
              <div class="mlabel">Token Usage <span style="color: var(--text-mute);">(Approx Cost)</span></div>
              <div class="mvalue">
                ~<span x-text="formatKTokens()"></span> Tokens
                <span class="unit" x-text="'($' + approxCost() + ')'"></span>
              </div>
              <span class="metric-chip" x-text="modelDisplayName()"></span>
            </div>
          </div>

          <!-- Tabs -->
          <div class="report-tabs">
            <button class="report-tab" :class="reportTab === 'exec' && 'active'" @click="reportTab = 'exec'">
              <span>📊</span> Overall Executive Summary
            </button>
            <button class="report-tab" :class="reportTab === 'personas' && 'active'" @click="reportTab = 'personas'">
              <span>👤</span> Detailed Persona Feedback
            </button>
          </div>

          <!-- Exec tab -->
          <template x-if="reportTab === 'exec'">
            <div>
              <template x-if="result.ab_verdict">
                <div class="verdict-banner">
                  <span class="trophy">🏆</span>
                  <div style="flex: 1;">
                    <h3>Overall A/B Verdict: <span class="winner" x-text="abWinnerLabel()"></span></h3>
                    <p x-text="result.ab_verdict.overall_reasoning"></p>
                  </div>
                  <a class="view-data" href="#" @click.prevent="showAbDetails = !showAbDetails">View Data</a>
                </div>
              </template>

              <template x-if="showAbDetails && result.ab_verdict">
                <div class="card" style="margin-bottom: 20px;">
                  <h3 style="margin-top: 0; font-size: 14px;">Per-persona verdict breakdown</h3>
                  <ul style="margin: 0; padding-left: 20px;">
                    <template x-for="pp in result.ab_verdict.per_persona" :key="pp.persona_id">
                      <li style="margin-bottom: 6px;">
                        <strong x-text="pp.persona_name"></strong> → <span x-text="pp.winner"></span>:
                        <span style="color: var(--text-soft);" x-text="pp.reason"></span>
                      </li>
                    </template>
                  </ul>
                </div>
              </template>

              <template x-if="result.reports.length > 1">
                <div class="seg">
                  <template x-for="r in result.reports" :key="r.campaign_label + '_seg'">
                    <div class="seg-opt" :class="activeCampaign === r.campaign_label && 'active'" @click="activeCampaign = r.campaign_label" x-text="'Variant ' + r.campaign_label"></div>
                  </template>
                </div>
              </template>

              <!-- Row 1: funnel chart (full width) -->
              <div class="card funnel-box" style="margin-bottom: 20px;">
                <h3>📉 Funnel Stage Drop-off</h3>
                <div class="funnel-v2">
                  <template x-for="(s, i) in activeReport().stage_aggregates" :key="s.stage + '_v2'">
                    <div class="fc-col">
                      <div class="fc-pct" :class="s.entered === 0 && 'muted'"
                           x-text="s.entered === 0 ? 'Skipped' : Math.round((s.continued / activeReport().personas.length) * 100) + '%'"></div>
                      <div class="fc-bar-slot">
                        <div class="fc-bar" :class="funnelBarClass(s, i)" :style="'height: ' + funnelBarPct(s) + '%;'"></div>
                      </div>
                      <div class="fc-label" x-text="s.label"></div>
                    </div>
                  </template>
                </div>
                <div class="funnel-caption" x-text="funnelCaption()"></div>
              </div>

              <!-- Row 2: dimension averages + outcome breakdown -->
              <div class="two-col" style="margin-bottom: 20px;">
                <div class="card dim-box">
                  <h3>📊 Average scores by dimension</h3>
                  <template x-if="dimensionScores()">
                    <div>
                      <template x-for="d in dimensionScores()" :key="d.key">
                        <div class="dim-row">
                          <div class="dim-label" x-text="d.label"></div>
                          <div class="dim-bar-wrap">
                            <div class="dim-bar" :class="d.band" :style="'width: ' + (d.value * 10) + '%;'"></div>
                          </div>
                          <div class="dim-score" x-text="d.value.toFixed(1)"></div>
                        </div>
                      </template>
                    </div>
                  </template>
                  <template x-if="!dimensionScores()">
                    <div style="color: var(--text-mute); font-size: 13px;">No scored reactions available.</div>
                  </template>
                  <div class="hint" style="margin-top: 12px;" x-text="weakestDimensionHint()"></div>
                </div>

                <div class="card outcome-box">
                  <h3>🎯 Persona outcomes</h3>
                  <div class="outcome-big">
                    <div class="outcome-tile converted">
                      <div class="t-label">Converted</div>
                      <div class="t-val" x-text="outcomeBreakdown().converted + ' / ' + outcomeBreakdown().total"></div>
                    </div>
                    <div class="outcome-tile dropped">
                      <div class="t-label">Dropped</div>
                      <div class="t-val" x-text="outcomeBreakdown().dropped + ' / ' + outcomeBreakdown().total"></div>
                    </div>
                  </div>
                  <template x-if="outcomeBreakdown().drops.length > 0">
                    <div>
                      <div class="label" style="margin-bottom: 6px;">Drop-off by stage</div>
                      <template x-for="dr in outcomeBreakdown().drops" :key="dr.stage">
                        <div class="drop-row">
                          <div class="dr-stage" x-text="dr.label"></div>
                          <div class="dr-count" x-text="dr.count + ' persona' + (dr.count === 1 ? '' : 's')"></div>
                        </div>
                      </template>
                    </div>
                  </template>
                  <template x-if="outcomeBreakdown().drops.length === 0">
                    <div style="color: var(--success); font-size: 13px;">Every persona completed the funnel.</div>
                  </template>
                </div>
              </div>

              <!-- Row 3: top issues (full width) -->
              <div class="card issues-box">
                <h3>⚑ Top Issues &amp; Recommendations</h3>
                <template x-if="activeReport().top_issues.length === 0">
                  <div style="color: var(--text-mute); font-size: 13px; padding: 4px 0;">No critical issues surfaced in this run.</div>
                </template>
                <template x-for="issue in activeReport().top_issues" :key="issue.title">
                  <div class="issue-card" :class="'cat-' + (issue.category || 'OTHER')">
                    <div class="top-row">
                      <span class="category-chip" x-text="issue.category || 'OTHER'"></span>
                      <span class="affects" x-text="'Affects ' + issue.frequency + ' persona' + (issue.frequency === 1 ? '' : 's')"></span>
                    </div>
                    <div class="title" x-text="issue.title"></div>
                    <div class="body" x-text="issue.stage ? issueContextLine(issue) : ''"></div>
                    <ul class="issue-quotes">
                      <template x-for="q in issue.example_quotes"><li x-text="q"></li></template>
                    </ul>
                    <template x-if="issue.recommendation">
                      <div class="rec"><b>Rec:</b> <span x-text="issue.recommendation"></span></div>
                    </template>
                  </div>
                </template>
              </div>
            </div>
          </template>

          <!-- Persona feedback tab -->
          <template x-if="reportTab === 'personas'">
            <div>
              <template x-if="result.reports.length > 1">
                <div class="seg">
                  <template x-for="r in result.reports" :key="r.campaign_label + '_pseg'">
                    <div class="seg-opt" :class="activeCampaign === r.campaign_label && 'active'" @click="activeCampaign = r.campaign_label" x-text="'Variant ' + r.campaign_label"></div>
                  </template>
                </div>
              </template>

              <div class="persona-chips">
                <template x-for="p in activeReport().personas" :key="p.persona_id + '_chip'">
                  <button class="persona-chip"
                          :class="[
                            selectedPersonaId === p.persona_id && 'active',
                            p.converted && 'converted'
                          ]"
                          @click="selectedPersonaId = p.persona_id">
                    <span class="c-icon" x-text="personaIconFor(p.persona_id)"></span>
                    <span x-text="p.persona_name"></span>
                    <span class="c-dot"></span>
                  </button>
                </template>
              </div>

              <template x-if="selectedPersona()">
                <div class="pj-card">
                  <div class="pj-head">
                    <span class="pj-icon" x-text="personaIconFor(selectedPersona().persona_id)"></span>
                    <div>
                      <div class="pj-name" x-text="selectedPersona().persona_name"></div>
                      <div class="pj-arch" x-text="selectedPersona().archetype"></div>
                    </div>
                    <span class="pj-status" :class="selectedPersona().converted ? 'ok' : 'bad'">
                      <template x-if="selectedPersona().converted">✓ converted</template>
                      <template x-if="!selectedPersona().converted">
                        <span x-text="'✕ dropped at ' + stageLabelInReport(selectedPersona().dropped_at, activeReport())"></span>
                      </template>
                    </span>
                  </div>
                  <div class="pj-summary" x-text="'“' + selectedPersona().final_summary + '”'"></div>
                  <template x-for="s in selectedPersona().stages" :key="s.stage + '_r'">
                    <div class="stage-reaction" :class="!s.continues && 'dropped'">
                      <div class="rlabel" x-text="stageLabelInReport(s.stage, activeReport())"></div>
                      <div class="rtext" x-text="s.reaction"></div>
                      <div class="rscores" x-text="scoresLine(s.scores)"></div>
                      <template x-if="s.drop_reason">
                        <div class="rdrop" x-text="'Drop reason: ' + s.drop_reason"></div>
                      </template>
                    </div>
                  </template>
                </div>
              </template>
            </div>
          </template>
        </div>
      </template>
    </main>
  </template>

  <footer class="footer">
    Crowdm — Native Ads Audience Simulator | Honest limits: Directional qualitative insight, not a CVR predictor.
  </footer>

  <script src="/static/app.js"></script>
</body>
</html>
