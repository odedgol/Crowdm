[project]
name = "crowdm"
version = "0.1.0"
description = "Synthetic-audience simulator for native-ads funnel evaluation"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.40.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "httpx>=0.27.0",
    "readability-lxml>=0.8.1",
    "lxml[html_clean]>=5.3.0",
    "beautifulsoup4>=4.12.0",
    "pydantic>=2.9.0",
    "python-multipart>=0.0.12",
    "python-dotenv>=1.0.1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["backend*"]
